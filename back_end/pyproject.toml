[project]
name = "opensweep-backend"
version = "0.1.0"
description = "OpenSweep — AI Engineering Control Plane (backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# `integration` = needs the dedicated test Neo4j on :7999 (tests/conftest.py).
# Registered so `-m integration` / `-m "not integration"` — how CI splits the
# two tiers — don't emit PytestUnknownMarkWarning.
markers = [
    "integration: requires the dedicated test Neo4j on localhost:7999",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# var/ holds vendored artifacts (ecc-source) with their own configs — not ours to lint.
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
